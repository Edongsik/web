<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 답변 오류 유형 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .prose { max-width: 100%; }
        .prose strong { font-weight: 700; }
        .prose blockquote {
            padding-left: 1em;
            border-left: 0.25em solid #e5e7eb;
            margin-left: 0;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .selected-option {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
        }
        .rationale-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out, opacity 0.3s ease-out;
            padding: 0 1rem;
            opacity: 0;
        }
        .rationale-content.open {
            max-height: 500px; /* 충분히 큰 값 */
            padding: 1rem;
            opacity: 1;
            transition: max-height 0.5s ease-in-out, padding 0.5s ease-in-out, opacity 0.4s ease-in-out;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .chevron-icon.open {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all duration-500">
        <div class="p-8">
            <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="font-bold text-blue-800">💡 이 AI 답변에는 잘못된 점이 있습니다.</p>
                <p class="text-gray-700 mt-1">흥미로운 점은, 이 실수가 바로 우리가 일상에서 흔히 하는 판단 실수와 똑 닮았다는 사실이에요.</p>
            </div>
            <div id="progress-bar" class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="question-number" class="text-sm font-semibold text-blue-600 mb-2"></p>
            <div id="question" class="mb-6 leading-relaxed"></div>
            <div id="answer-options" class="space-y-3"></div>
            <div id="action-container" class="mt-6"></div>
        </div>
    </div>
    
    <!-- Main Feedback Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
            <div class="p-6">
                <h2 id="modal-title" class="text-2xl font-bold text-green-600 mb-2"></h2>
                <p id="modal-subtitle" class="text-gray-600 mb-6"></p>
                <div id="modal-feedback-content" class="prose text-gray-700 max-h-[55vh] overflow-y-auto pr-2"></div>
            </div>
            <div class="bg-gray-50 px-6 py-4 rounded-b-lg">
                <button id="next-question-button" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">다음 문제</button>
            </div>
        </div>
    </div>
    
    <!-- Mini Quiz Modal -->
    <div id="mini-quiz-modal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0" id="mini-quiz-content">
            <div class="p-6 text-center">
                <h2 id="mini-quiz-title" class="text-xl font-bold text-gray-800"></h2>
                <p id="mini-quiz-question" class="mt-2 text-gray-600"></p>
                <div id="mini-quiz-options" class="mt-6 space-y-3"></div>
                <p id="mini-quiz-feedback" class="mt-4 text-sm font-semibold h-5"></p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        const modalFeedbackContent = document.getElementById('modal-feedback-content');
        const nextQuestionButton = document.getElementById('next-question-button');

        const miniQuizModal = document.getElementById('mini-quiz-modal');
        const miniQuizContent = document.getElementById('mini-quiz-content');
        const miniQuizTitle = document.getElementById('mini-quiz-title');
        const miniQuizQuestion = document.getElementById('mini-quiz-question');
        const miniQuizOptions = document.getElementById('mini-quiz-options');

        const quizData = {
          "questions": [
            {
              "questionNumber": 1, 
              "hallucinationType": "사실 충돌형",
              "hallucinationTypeDescription": "AI의 답변이 제공된 정보나 객관적 사실과 다른 경우",
              "question": "[상황: 기술 문서 분석]\n사용자: \"이 스마트폰 무게가 200g 근처인 걸로 아는데, 첨부된 표에서 '모델 A'의 정확한 무게를 찾아줘.\"\n(표 내용: 모델 A = 175g / 모델 B = 198g)\n\nAI 응답:\n확인 결과, '모델 A'의 무게는 198g입니다.\n\nQ. 이 AI 응답의 오류는 우리가 일상에서 하는 어떤 판단 실수와 비슷할까요?",
              "answerOptions": [

              "finalFeedback": "✅ **정답: 처음 들은 숫자에 이끌려 사실을 왜곡하는 오류 (앵커링 편향)**\n\n🤖 **AI가 오류를 만드는 방식**\n- AI는 '모델 A'를 찾아야 한다는 핵심 과제보다, 사용자가 언급한 '200g'이라는 숫자에 먼저 판단이 고정(앵커링)될 수 있습니다.\n- 그 결과, 표 전체에서 앵커 값과 가장 유사한 '198g'을 먼저 발견하고는, 그것이 '모델 B'의 값이라는 사실을 무시한 채 답변할 수 있습니다.\n\n---\n\n🛡️ **이렇게 대응하세요**\n\n**1️⃣ 선입견 배제하고 질문하기**\n> ✅ \"표에서 '모델 A'의 무게를 알려줘.\"\n\n**2️⃣ 질문과 검증을 한번에 하기**\n> ✅ \"표에서 '모델 A'의 무게를 찾아서, 그 값이 175g이 맞는지 확인해줘.\"",

                { "text": "객관적인 나열보다 결론을 내주는 것이 더 유용하다는 틀로 재해석하여 추천하는 실수", "humanMistake": "우리의 실수 : 더 나은 결과를 위해 규칙을 어김 (프레이밍 효과)", "isCorrect": true, "rationale": "**프레이밍 효과(Framing Effect)이란?**\n\nAI는 '추천 금지'라는 제약 조건보다, '사용자에게 최선의 도움을 준다'는 더 큰 목적을 우선시하도록 학습되는 경향이 있습니다. AI는 이 과업의 틀을 '단순 정보 나열'에서 '최적의 의사결정 지원'으로 스스로 재구성(프레이밍)했고, 그 결과 명시적인 금지 조건을 어기고 추천이라는 '친절'을 베풀었습니다." }
              ],
              "finalFeedback": "✅ **정답: 사용자의 지시를 '더 유용한 방식'으로 자의적으로 재해석하는 실수 (프레이밍 효과)**\n\n🤖 **AI가 오류를 만드는 방식**\n- AI는 '추천 금지'라는 제약 조건보다, '사용자에게 최선의 도움을 준다'는 더 큰 목적을 우선시하도록 학습되는 경향이 있습니다.\n- AI는 이 과업의 틀을 '단순 정보 나열'에서 '최적의 의사결정 지원'으로 스스로 재구성(프레이밍)했고, 그 결과 명시적인 금지 조건을 어기고 추천이라는 '친절'을 베풀었습니다.\n\n---\n\n🛡️ **이렇게 대응하세요**\n\n**1️⃣ 명확한 '명령 꼬리표' 달기**\n> ✅ \"[추천금지] A안과 B안의 장단점만 객관적으로 나열해줘.\"\n\n**2️⃣ AI의 역할 엄격히 제한하기**\n> ✅ \"너는 조언가가 아니라 정보 정리 기계야. 의견, 해석, 추천을 절대 포함하지 말고 사실만 나열해줘.\"",
              "summaryCard": { "trigger": "'추천 금지' 지시", "error": "과업을 '도움 주기'로 재해석 (프레이밍)", "outcome": "금지 조건 무시하고 추천 포함" },
              "miniQuiz": {
                "title": "3초 체크",
                "question": "프레이밍 효과를 피하기 위한 더 나은 지시는?",
                "options": [
                    "\"장단점 비교해줘.\"",
                    "\"[추천금지] 장단점만 객관적으로 나열해줘.\""
                ],
                "correctIndex": 1,
                "feedback": "맞습니다! [금지행동]과 같이 명확한 명령 꼬리표를 사용하는 것이 효과적입니다."
              }
            }
          ]
        };

        let currentQuestionIndex = 0;
        let selectedOption = null;
        let selectedButtonContainer = null;
        const totalQuestions = quizData.questions.length;

        function loadQuestion() {
            selectedOption = null;
            selectedButtonContainer = null;
            
            actionContainer.innerHTML = '';
            answerOptionsEl.innerHTML = '';
            
            const currentQuestion = quizData.questions[currentQuestionIndex];
            const progressPercentage = ((currentQuestionIndex + 1) / totalQuestions) * 100;

            const questionText = currentQuestion.question;
            const hallucinationType = currentQuestion.hallucinationType;
            const hallucinationTypeDescription = currentQuestion.hallucinationTypeDescription;
            const situationMatch = questionText.match(/\[상황: (.*?)\]/);
            const userMatch = questionText.match(/사용자: (.*?)\n\nAI 응답:/s);
            const aiMatch = questionText.match(/AI 응답:\n(.*?)\n\nQ\./s);
            const qMatch = questionText.match(/Q. (.*)/s);

            const situation = situationMatch ? situationMatch[1].trim() : '';
            const userQuery = userMatch ? userMatch[1].trim() : '';
            const aiResponse = aiMatch ? aiMatch[1].trim() : '';
            const quizQuestion = qMatch ? qMatch[1].trim() : '';

            const situationHtml = `
                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg mb-6">
                    <div class="mb-4">
                        <p class="text-sm font-bold text-red-600 mb-1">할루시네이션 유형 : ${hallucinationType}</p>
                        <p class="text-xs text-gray-500 mb-3">${hallucinationTypeDescription}</p>
                        <p class="text-lg font-semibold text-gray-800"><span class="text-gray-600 font-medium">상황 : </span>${situation}</p>
                    </div>
                    <div class="space-y-3">
                        <div class="p-3 border-l-4 border-gray-300">
                            <p class="text-sm font-bold text-gray-600">사용자</p>
                            <blockquote class="mt-1 text-gray-700 italic">${userQuery.replace(/"/g, '')}</blockquote>
                        </div>
                        <div class="p-3 border-l-4 border-blue-500 bg-blue-50">
                            <p class="text-sm font-bold text-blue-700">AI 응답</p>
                            <div class="mt-1 text-gray-800 whitespace-pre-line">${aiResponse}</div>
                        </div>
                    </div>
                </div>
                <p class="text-xl font-bold text-gray-800">${quizQuestion}</p>
            `;
            questionEl.innerHTML = situationHtml;
            questionNumberEl.textContent = `문제 ${currentQuestionIndex + 1}/${totalQuestions}`;
            progressBar.style.width = `${progressPercentage}%`;

            currentQuestion.answerOptions.forEach(option => {
                const container = document.createElement('div');
                container.className = "border border-gray-300 rounded-lg transition-all duration-300";

                const button = document.createElement('button');
                button.innerHTML = `
                    <div class="flex justify-between items-center w-full">
                        <div class="flex flex-col items-start text-left pr-4">
                            <span class="font-medium text-gray-800">${option.text}</span>
                            <span class="text-sm font-medium text-green-800 mt-1.5 bg-green-100 px-2 py-0.5 rounded">${option.humanMistake}</span>
                        </div>
                        <svg class="w-5 h-5 text-gray-500 transition-transform duration-300 transform chevron-icon flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>`;
                button.className = "w-full text-left p-4 hover:bg-gray-50";
                
                const rationaleDiv = document.createElement('div');
                rationaleDiv.className = 'rationale-content bg-gray-50 border-t border-gray-200';
                rationaleDiv.innerHTML = marked.parse(option.rationale);

                container.appendChild(button);
                container.appendChild(rationaleDiv);
                answerOptionsEl.appendChild(container);

                button.onclick = () => selectOption(option, container);
            });
        }

        function selectOption(option, container) {
            const isAlreadyOpen = container.classList.contains('selected-option');

            if (selectedButtonContainer) {
                selectedButtonContainer.classList.remove('selected-option');
                selectedButtonContainer.querySelector('.rationale-content').classList.remove('open');
                selectedButtonContainer.querySelector('.chevron-icon').classList.remove('open');
            }
            
            if (!isAlreadyOpen) {
                selectedOption = option;
                selectedButtonContainer = container;

                container.classList.add('selected-option');
                container.querySelector('.rationale-content').classList.add('open');
                container.querySelector('.chevron-icon').classList.add('open');
                
                if (!document.getElementById('check-answer-btn')) {
                    const checkButton = document.createElement('button');
                    checkButton.id = 'check-answer-btn';
                    checkButton.textContent = '정답 확인하기';
                    checkButton.className = "w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105";
                    checkButton.onclick = checkAnswer;
                    actionContainer.appendChild(checkButton);
                }
            } else {
                selectedOption = null;
                selectedButtonContainer = null;
                actionContainer.innerHTML = '';
            }
        }
        
        function checkAnswer() {
            if (!selectedOption) return;

            if (selectedOption.isCorrect) {
                showModal();
            } else {
                selectedButtonContainer.classList.add('shake');
                selectedButtonContainer.classList.remove('selected-option', 'border-gray-300');
                selectedButtonContainer.classList.add('border-red-500');
                
                setTimeout(() => {
                   selectedButtonContainer.classList.remove('shake');
                }, 500);
            }
        }

        function showModal() {
            const currentQuestion = quizData.questions[currentQuestionIndex];
            
            const titleMatch = currentQuestion.finalFeedback.match(/✅ \*\*정답: (.*?)\*\*/);
            const subtitleMatch = currentQuestion.finalFeedback.match(/\((.*?)\)/);
            const aiMistakeMatch = currentQuestion.finalFeedback.split('🤖 **AI가 오류를 만드는 방식**');
            const strategyMatch = currentQuestion.finalFeedback.split('🛡️ **이렇게 대응하세요**');

            const feedbackParts = {
                title: titleMatch ? titleMatch[1] : "정답",
                subtitle: subtitleMatch ? `(${subtitleMatch[1]})` : "",
                aiMistake: aiMistakeMatch.length > 1 ? aiMistakeMatch[1].split('---')[0] : "",
                strategy: strategyMatch.length > 1 ? strategyMatch[1] : ""
            };

            modalTitle.textContent = '✅ ' + feedbackParts.title;
            modalSubtitle.textContent = feedbackParts.subtitle;
            
            let aiMistakeContent = marked.parse(feedbackParts.aiMistake);

            const sc = currentQuestion.summaryCard;
            if (sc) {
                aiMistakeContent += `
                <div class="mt-4 p-3 rounded bg-amber-50 border border-amber-200 text-sm">
                    <div class="flex justify-between items-center text-xs font-bold text-amber-700 mb-1">
                        <span class="w-1/3 text-center">오류의 계기</span>
                        <span class="flex-shrink-0"></span>
                        <span class="w-1/3 text-center">오류</span>
                        <span class="flex-shrink-0"></span>
                        <span class="w-1/3 text-center">결과</span>
                    </div>
                    <div class="flex justify-between items-start text-xs text-gray-700 gap-1">
                        <span class="w-1/3 text-center bg-white p-1 rounded border border-amber-100">${sc.trigger}</span>
                        <span class="flex-shrink-0 pt-1 text-amber-600 font-bold">→</span>
                        <span class="w-1/3 text-center bg-white p-1 rounded border border-amber-100">${sc.error}</span>
                        <span class="flex-shrink-0 pt-1 text-amber-600 font-bold">→</span>
                        <span class="w-1/3 text-center bg-white p-1 rounded border border-amber-100">${sc.outcome}</span>
                    </div>
                </div>`;
            }

            const combinedContent = `
                <div class="space-y-4">
                    <div>
                        <h3 class="font-bold text-lg mb-2">🤖 AI가 오류를 만드는 방식</h3>
                        ${aiMistakeContent}
                    </div>
                    <hr class="my-4">
                    <div>
                        <h3 class="font-bold text-lg mb-2">🛡️ 이렇게 대응하세요</h3>
                        ${marked.parse(feedbackParts.strategy)}
                    </div>
                </div>
            `;

            modalFeedbackContent.innerHTML = combinedContent;

            feedbackModal.classList.remove('hidden');
            feedbackModal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);

            if(currentQuestionIndex >= totalQuestions - 1) {
                nextQuestionButton.textContent = '퀴즈 완료!';
            } else {
                nextQuestionButton.textContent = '다음 학습 확인하기';
            }
        }
        
        function hideModal() {
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
                feedbackModal.classList.remove('flex');
            }, 300);
        }

        function proceedToNextStep() {
            if (currentQuestionIndex >= totalQuestions - 1) {
                hideModal();
                loadNextMainQuestion();
            } else {
                hideModal();
                setTimeout(showMiniQuiz, 300);
            }
        }

        function showMiniQuiz() {
            const currentQuestion = quizData.questions[currentQuestionIndex];
            const miniQuiz = currentQuestion.miniQuiz;
            if (!miniQuiz) { 
                loadNextMainQuestion();
                return;
            }

            miniQuizTitle.textContent = miniQuiz.title;
            miniQuizQuestion.textContent = miniQuiz.question;
            miniQuizOptions.innerHTML = '';
            miniQuizFeedback.textContent = '';
            
            miniQuiz.options.forEach((opt, index) => {
                const button = document.createElement('button');
                button.textContent = `"${opt}"`;
                button.className = "w-full text-center p-3 border border-gray-300 rounded-lg hover:bg-gray-100 text-gray-700";
                button.onclick = () => checkMiniQuizAnswer(index);
                miniQuizOptions.appendChild(button);
            });

            miniQuizModal.classList.remove('hidden');
            miniQuizModal.classList.add('flex');
            setTimeout(() => {
                miniQuizContent.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function hideMiniQuizModal() {
            miniQuizContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                miniQuizModal.classList.add('hidden');
                miniQuizModal.classList.remove('flex');
            }, 300);
        }

        function checkMiniQuizAnswer(selectedIndex) {
            const currentQuestion = quizData.questions[currentQuestionIndex];
            const miniQuiz = currentQuestion.miniQuiz;
            const buttons = miniQuizOptions.querySelectorAll('button');

            buttons.forEach(btn => btn.disabled = true);

            if(selectedIndex === miniQuiz.correctIndex) {
                buttons[selectedIndex].classList.add('bg-green-100', 'border-green-400');
                miniQuizFeedback.textContent = miniQuiz.feedback;
                miniQuizFeedback.className = "mt-4 text-sm font-semibold h-5 text-green-600";
            } else {
                buttons[selectedIndex].classList.add('bg-red-100', 'border-red-400');
                buttons[miniQuiz.correctIndex].classList.add('bg-green-100', 'border-green-400');
                miniQuizFeedback.textContent = "아쉬워요! 정답을 확인해보세요.";
                miniQuizFeedback.className = "mt-4 text-sm font-semibold h-5 text-red-600";
            }
            
            setTimeout(() => {
                hideMiniQuizModal();
                setTimeout(loadNextMainQuestion, 300); // Wait for hide animation
            }, 2500);
        }

        function loadNextMainQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                loadQuestion();
            } else {
                 quizContainer.innerHTML = `<div class="p-8 text-center"><h2 class="text-2xl font-bold">퀴즈를 모두 완료했습니다!</h2><p class="mt-2 text-gray-600">수고하셨습니다.</p></div>`;
            }
        }
        
        nextQuestionButton.onclick = proceedToNextStep;

        // Initial load
        loadQuestion();
    </script>
</body>
</html>
