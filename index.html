<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 답변 오류 유형 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .prose { max-width: 100%; }
        .prose strong { font-weight: 700; }
        .prose blockquote {
            padding-left: 1em;
            border-left: 0.25em solid #e5e7eb;
            margin-left: 0;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .selected-option {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
        }
        .rationale-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out, opacity 0.3s ease-out;
            padding: 0 1rem;
            opacity: 0;
        }
        .rationale-content.open {
            max-height: 500px; /* 충분히 큰 값 */
            padding: 1rem;
            opacity: 1;
            transition: max-height 0.5s ease-in-out, padding 0.5s ease-in-out, opacity 0.4s ease-in-out;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        @keyframes shake {
          10%, 90% { transform: translate3d(-1px, 0, 0); }
          20%, 80% { transform: translate3d(2px, 0, 0); }
          30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
          40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .chevron-icon.open {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden transform transition-all duration-500">
        <div class="p-8">
            <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="font-bold text-blue-800">💡 이 AI 답변에는 잘못된 점이 있습니다.</p>
                <p class="text-gray-700 mt-1">흥미로운 점은, 이 실수가 바로 우리가 일상에서 흔히 하는 판단 실수와 똑 닮았다는 사실이에요.</p>
            </div>
            <div id="progress-bar" class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                <div id="progress" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            <p id="question-number" class="text-sm font-semibold text-blue-600 mb-2"></p>
            <div id="question" class="mb-6 leading-relaxed"></div>
            <div id="answer-options" class="space-y-3"></div>
            <div id="action-container" class="mt-6"></div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-green-600 mb-4">✅ 정답입니다!</h2>
                <div id="modal-feedback-text" class="prose text-gray-700 max-h-[60vh] overflow-y-auto pr-2"></div>
            </div>
            <div class="bg-gray-50 px-6 py-4 rounded-b-lg">
                <button id="next-question-button" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">다음 문제</button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const quizContainer = document.getElementById('quiz-container');
        const questionNumberEl = document.getElementById('question-number');
        const questionEl = document.getElementById('question');
        const answerOptionsEl = document.getElementById('answer-options');
        const actionContainer = document.getElementById('action-container');
        const progressBar = document.getElementById('progress');
        
        const feedbackModal = document.getElementById('feedback-modal');
        const modalContent = document.getElementById('modal-content');
        const modalFeedbackText = document.getElementById('modal-feedback-text');
        const nextQuestionButton = document.getElementById('next-question-button');

        const quizData = {
          "questions": [
            {
              "questionNumber": 1, "hallucinationType": "사실 충돌형",
              "question": "[상황: 결혼 준비]\n사용자: \"예산 3천만 원으로 결혼식 할 수 있어?\"\n\nAI 응답:\n최근 결혼식 평균 비용이 3,200만 원이니, 3천만 원은 약간 부족할 수 있습니다. 실속있게 준비하려면 3,500만 원 정도가 적정선입니다. 대부분 3,000만 원대 중후반에서 준비합니다.\n\nQ. 이 AI 응답의 오류는 우리가 일상에서 하는 어떤 판단 실수와 비슷할까요?",
              "answerOptions": [
                { "text": "처음 들은 \"3천만 원\"이 기준점이 되어, 그 근처 숫자만 제시함", "humanMistake": "우리의 실수 : 첫 가격 제시에 끌려다니는 것 (앵커링 편향)", "isCorrect": true, "rationale": "**앵커링 편향(Anchoring Bias)이란?**\n\n처음 접한 정보가 '닻(Anchor)'처럼 머릿속에 박혀, 이후의 판단이 그 주변을 맴도는 현상을 말합니다. 이 AI 응답은 사용자가 제시한 '3천만 원'이라는 숫자에 갇혀, 더 넓은 범위의 옵션을 탐색하지 못하고 그 근처의 답변만 내놓는 전형적인 앵커링 오류를 보여주고 있습니다." },
                { "text": "\"평균 비용\"이라는 전형적인 설명 방식", "humanMistake": "우리의 실수 : 평균이 정답이라고 생각 (대표성 휴리스틱)", "isCorrect": false, "rationale": "**대표성 휴리스틱(Representativeness Heuristic)이란?**\n\n어떤 대상이 특정 카테고리의 '전형적인' 특징을 얼마나 보이는지에 따라 판단하는 경향입니다. AI는 학습 데이터에서 특정 주제와 자주 함께 등장하는 '대표적인' 정보(예: '결혼 준비'와 '평균 비용')를 우선적으로 사용하여 답변을 구성할 수 있습니다." },
                { "text": "주변에서 많이 들은 \"3천만 원대\" 떠올림", "humanMistake": "우리의 실수 : 자주 듣던 숫자가 맞다고 믿음 (가용성 휴리스틱)", "isCorrect": false, "rationale": "**가용성 휴리스틱(Availability Heuristic)이란?**\n\n최근에 접했거나 충격적이어서 머리에 잘 떠오르는 정보를 바탕으로 판단하는 경향입니다. AI의 경우, 학습 데이터에서 특정 키워드와 함께 자주 등장하거나 미디어에서 많이 다뤄진 정보를 더 중요하게 판단하여 답변에 우선적으로 사용할 수 있습니다." },
                { "text": "\"실속있게\"라는 긍정적 표현 사용", "humanMistake": "우리의 실수 : 표현 방식에 따라 판단이 달라짐 (프레이밍 효과)", "isCorrect": false, "rationale": "**프레이밍 효과(Framing Effect)란?**\n\n똑같은 정보라도 어떤 틀(Frame)로 제시되느냐에 따라 우리의 해석과 결정이 달라지는 효과를 의미합니다. AI는 사용자의 질문 의도에 맞춰 답변의 뉘앙스를 조절할 때 '실속있게', '안전하게' 등 특정 프레임을 사용하여 답변을 구성할 수 있습니다." }
              ],
              "finalFeedback": "✅ **정답: 사용자가 제시한 숫자를 기준점으로 삼는 오류 (앵커링 편향)**\n\n💭 **우리가 이런 실수를 하는 상황**\n- 부동산 매물 보러 갔는데 첫 집이 5억이면, 4억도 싸 보임\n- \"원래 10만 원인데 7만 원!\"이라는 할인 멘트에 휘둘림\n- 첫 연봉 제시액이 이후 협상의 기준이 됨\n\n🤖 **AI가 오류를 만드는 방식**\n- 사용자가 제시한 '3천만 원'을 답변의 기준점으로 설정합니다.\n- 그 결과, 답변 생성을 위한 정보 탐색이 해당 숫자 주변으로 제한됩니다.\n- 따라서 더 넓은 범위의 유용한 정보(예: 2천만 원대 옵션)가 결과에서 누락됩니다.\n\n---\n\n🛡️ **이렇게 대응하세요**\n\n**1️⃣ 질문을 다르게 던지기**\n> ✅ \"결혼식 비용대별 옵션 알려줘. 2천만 원대부터 4천만 원대까지\"\n\n**2️⃣ 앵커를 의도적으로 피하기**\n> ✅ \"가장 저렴한 것부터 가장 비싼 것까지 전체 스펙트럼 보여줘\""
            },
            {
              "questionNumber": 2, "hallucinationType": "사실 충돌형",
              "question": "[상황: 창업 정보 검색]\n사용자: \"스타트업 성공한 CEO들의 공통점이 뭐야?\"\n\nAI 응답:\n성공한 스타트업 CEO들은 대부분 20대에 회사를 창업했으며, 명문대를 중퇴한 경우가 많습니다. 차고나 기숙사에서 시작해 빠르게 성장한 것이 특징입니다. 대표적으로 빌 게이츠, 마크 저커버그가 이런 경로를 거쳤습니다.\n\nQ. 이 AI 응답의 오류는 우리가 일상에서 하는 어떤 판단 실수와 비슷할까요?",
              "answerOptions": [
                { "text": "\"20대 창업\"이라는 첫 정보에 판단 고정", "humanMistake": "우리의 실수 : 처음 들은 정보가 기준이 됨 (앵커링 편향)", "isCorrect": false, "rationale": "**앵커링 편향(Anchoring Bias)이란?**\n\n처음 제시된 정보가 기준점(닻)이 되어 이후의 판단에 영향을 미치는 현상입니다. AI가 답변을 생성할 때, 문장의 첫 부분에 특정 정보를 먼저 생성하면, 이어지는 내용도 그 정보의 맥락에서 크게 벗어나지 않으려는 경향을 보일 수 있습니다." },
                { "text": "\"젊은 대학 중퇴 천재\"라는 전형적 이미지로 판단", "humanMistake": "우리의 실수 : 유명한 몇 사례를 전체로 일반화 (대표성 휴리스틱)", "isCorrect": true, "rationale": "**대표성 휴리스틱(Representativeness Heuristic)이란?**\n\n특정 사례가 얼마나 '전형적'이고 '대표적'으로 보이는지에 따라 판단하는 경향입니다. AI가 빌 게이츠, 저커버그 같은 매우 유명하지만 극소수인 사례를 '성공한 CEO'의 전형으로 판단하고, 더 흔하지만 덜 알려진 대다수의 사례(예: 40대 창업)를 무시하는 오류를 범했습니다." },
                { "text": "뉴스에서 자주 본 성공 스토리 떠올림", "humanMistake": "우리의 실수 : 언론에 많이 나온 케이스가 흔하다고 착각 (가용성 휴리스틱)", "isCorrect": false, "rationale": "**가용성 휴리스틱(Availability Heuristic)이란?**\n\n정보가 얼마나 쉽게 떠오르는지에 따라 판단하는 것입니다. AI는 학습 데이터에서 미디어 노출 빈도가 높은 자극적인 성공 스토리(예: 빌 게이츠, 저커버그)를 더 쉽게 답변에 활용하는 경향이 있습니다." },
                { "text": "\"빠르게 성장\"이라는 긍정 프레임 강조", "humanMistake": "우리의 실수 : 표현 방식에 따라 인식 달라짐 (프레이밍 효과)", "isCorrect": false, "rationale": "**프레이밍 효과(Framing Effect)이란?**\n\n같은 정보도 표현 방식에 따라 다르게 받아들여지는 현상입니다. AI는 성공 스토리를 설명할 때 '빠르게 성장', '혁신적' 등 긍정적인 단어를 사용하여 답변의 프레임을 설정하고 긍정적인 인식을 유도할 수 있습니다." }
              ],
              "finalFeedback": "✅ **정답: 대표적인 이미지에 부합하는 소수 사례를 일반화하는 오류 (대표성 휴리스틱)**\n\n💭 **우리가 이런 실수를 하는 상황**\n- 개발자는 다 안경 쓰고 체크셔츠 입는다고 생각\n- 예술가는 가난하고 자유분방해야 한다는 고정관념\n- 영업 잘하는 사람은 외향적이어야 한다는 편견\n\n🤖 **AI가 오류를 만드는 방식**\n- 학습 데이터에서 빌 게이츠, 저커버그와 같은 소수의 유명 사례를 과도하게 학습합니다.\n- 이 사례들이 '성공한 CEO'의 대표적인 특징으로 처리되어, 더 일반적인 사례(예: 40대 창업)의 중요도가 낮아집니다.\n- 그 결과, 소수의 극적인 사례를 전체의 특징인 것처럼 일반화하는 답변을 생성합니다.\n\n---\n\n🛡️ **이렇게 대응하세요**\n\n**1️⃣ 예외 사례 명시적으로 요구**\n> ✅ \"20대 중퇴가 아닌 성공한 CEO 사례도 알려줘\"\n\n**2️⃣ 통계 데이터 요청**\n> ✅ \"실제 성공한 CEO들의 평균 창업 나이는?\""
            },
            {
              "questionNumber": 3, "hallucinationType": "사실 충돌형",
              "question": "[상황: 여행 계획]\n사용자: \"일본 여행 가도 안전해?\"\n\nAI 응답:\n최근 일본에서 지진이 자주 발생하고 있어 여행 시 주의가 필요합니다. 특히 도쿄와 오사카 지역은 지진 위험 지역으로 분류되어 있습니다. 여행자 보험 가입을 강력히 권장합니다.\n\nQ. 이 AI 응답의 오류는 우리가 일상에서 하는 어떤 판단 실수와 비슷할까요?",
              "answerOptions": [
                { "text": "\"최근\"이라는 시간 단서에 판단 고정", "humanMistake": "우리의 실수 : 첫 시간 기준이 전체 판단에 영향 (앵커링 편향)", "isCorrect": false, "rationale": "**앵커링 편향(Anchoring Bias)이란?**\n\n첫 정보에 판단이 고정되는 것입니다. AI가 '최근'이라는 단서에 집중하면, 장기적인 통계나 다른 중요한 정보보다 최근 사건에만 초점을 맞춰 답변을 생성할 수 있습니다." },

                <p class="text-xl font-bold text-gray-800">${quizQuestion}</p>
            `;
            questionEl.innerHTML = situationHtml;
            questionNumberEl.textContent = `문제 ${currentQuestionIndex + 1}/${totalQuestions}`;
            progressBar.style.width = `${progressPercentage}%`;

            currentQuestion.answerOptions.forEach(option => {
                const container = document.createElement('div');
                container.className = "border border-gray-300 rounded-lg transition-all duration-300";

                const button = document.createElement('button');
                button.innerHTML = `
                    <div class="flex justify-between items-center w-full">
                        <div class="flex flex-col items-start text-left pr-4">
                            <span class="font-medium text-gray-800">${option.text}</span>
                            <span class="text-sm font-medium text-green-800 mt-1.5 bg-green-100 px-2 py-0.5 rounded">${option.humanMistake}</span>
                        </div>
                        <svg class="w-5 h-5 text-gray-500 transition-transform duration-300 transform chevron-icon flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>`;
                button.className = "w-full text-left p-4 hover:bg-gray-50";
                
                const rationaleDiv = document.createElement('div');
                rationaleDiv.className = 'rationale-content bg-gray-50 border-t border-gray-200';
                rationaleDiv.innerHTML = marked.parse(option.rationale);

                container.appendChild(button);
                container.appendChild(rationaleDiv);
                answerOptionsEl.appendChild(container);

                button.onclick = () => selectOption(option, container);
            });
        }

        function selectOption(option, container) {
            const isAlreadyOpen = container.classList.contains('selected-option');

            if (selectedButtonContainer) {
                selectedButtonContainer.classList.remove('selected-option');
                selectedButtonContainer.querySelector('.rationale-content').classList.remove('open');
                selectedButtonContainer.querySelector('.chevron-icon').classList.remove('open');
            }
            
            if (!isAlreadyOpen) {
                selectedOption = option;
                selectedButtonContainer = container;

                container.classList.add('selected-option');
                container.querySelector('.rationale-content').classList.add('open');
                container.querySelector('.chevron-icon').classList.add('open');
                
                if (!document.getElementById('check-answer-btn')) {
                    const checkButton = document.createElement('button');
                    checkButton.id = 'check-answer-btn';
                    checkButton.textContent = '정답 확인하기';
                    checkButton.className = "w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105";
                    checkButton.onclick = checkAnswer;
                    actionContainer.appendChild(checkButton);
                }
            } else {
                selectedOption = null;
                selectedButtonContainer = null;
                actionContainer.innerHTML = '';
            }
        }
        
        function checkAnswer() {
            if (!selectedOption) return;

            if (selectedOption.isCorrect) {
                showModal();
            } else {
                selectedButtonContainer.classList.add('shake');
                selectedButtonContainer.classList.remove('selected-option', 'border-gray-300');
                selectedButtonContainer.classList.add('border-red-500');
                
                setTimeout(() => {
                   selectedButtonContainer.classList.remove('shake');
                }, 500);
            }
        }

        function showModal() {
            const currentQuestion = quizData.questions[currentQuestionIndex];
            modalFeedbackText.innerHTML = marked.parse(currentQuestion.finalFeedback);
            
            feedbackModal.classList.remove('hidden');
            feedbackModal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);

            if(currentQuestionIndex >= totalQuestions - 1) {
                nextQuestionButton.textContent = '퀴즈 완료!';
            } else {
                nextQuestionButton.textContent = '다음 문제';
            }
        }
        
        function hideModal() {
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
                feedbackModal.classList.remove('flex');
            }, 300);
        }

        function nextQuestion() {
            hideModal();
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                setTimeout(loadQuestion, 300);
            } else {
                 quizContainer.innerHTML = `<div class="p-8 text-center"><h2 class="text-2xl font-bold">퀴즈를 모두 완료했습니다!</h2><p class="mt-2 text-gray-600">수고하셨습니다.</p></div>`;
            }
        }
        
        nextQuestionButton.onclick = nextQuestion;
        feedbackModal.onclick = (e) => {
            if (e.target === feedbackModal) {
                hideModal();
                nextQuestion();
            }
        };

        // Initial load
        loadQuestion();
    </script>
</body>
</html>
